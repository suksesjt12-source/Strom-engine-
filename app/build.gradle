
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.storm.engine'
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId 'com.storm.engine'
        minSdk 23
        targetSdk 28

        versionCode 1
        versionName '1.0.1'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }
}
